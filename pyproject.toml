[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomedical-negation-detection"
version = "0.1.0"
description = "Recovered and reconstructed negation cue and scope detection experiments over BIOSCOPE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34",
  "datasets>=2.21",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "sklearn-crfsuite>=0.3.6",
  "torch>=2.2",
  "transformers>=4.44",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

